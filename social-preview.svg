<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Idea Search Showcase</title>
  <desc id="og-desc">Human judgment becomes reviewed memory, then context for a later creative search.</desc>
  <defs>
    <radialGradient id="glow" cx="12%" cy="4%" r="80%">
      <stop offset="0" stop-color="#0c2639"/><stop offset="1" stop-color="#04060f"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#04060f"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <image x="54" y="54" width="47" height="36" href="data:image/png;base64,"/>
  <text x="118" y="81" font-family="DejaVu Sans,sans-serif" font-weight="600" font-size="25" fill="#f2f6ff">Idea Search</text>
  <text x="1080" y="80" text-anchor="end" font-family="DejaVu Sans Mono,monospace" font-size="16" fill="#9fb0d0">SHOWCASE</text>
  <text x="54" y="177" font-family="DejaVu Sans,sans-serif" font-size="43" font-weight="600" fill="#f2f6ff">Messy human judgment.</text>
  <text x="54" y="236" font-family="DejaVu Sans,sans-serif" font-size="43" font-weight="600" fill="#22d3ee">Modular memory for the next search.</text>
  <text x="54" y="284" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#9fb0d0">Compare creative directions. Review the lessons. Choose what carries forward.</text>
  <path d="M54 323H1146" stroke="url(#edge)" stroke-width="2"/>
  <rect x="54" y="350" width="346" height="166" rx="14" fill="#0c1224" stroke="#2e4262"/>
  <text x="77" y="385" font-family="DejaVu Sans Mono,monospace" font-size="15" fill="#9fb0d0">01 / HUMAN JUDGMENT</text>
  <text x="77" y="432" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#f2f6ff">“I get texture</text>
  <text x="77" y="469" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#f2f6ff">and no product.”</text>
  <rect x="426" y="350" width="346" height="166" rx="14" fill="#0c2030" stroke="#22d3ee"/>
  <text x="449" y="385" font-family="DejaVu Sans Mono,monospace" font-size="15" fill="#22d3ee">02 / EDITED &amp; ACCEPTED</text>
  <text x="449" y="432" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#f2f6ff">Keep the product legible</text>
  <text x="449" y="469" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#f2f6ff">in the final beat.</text>
  <rect x="798" y="350" width="348" height="166" rx="14" fill="#0c1224" stroke="#2e4262"/>
  <text x="821" y="385" font-family="DejaVu Sans Mono,monospace" font-size="15" fill="#9fb0d0">03 / LATER SEARCH</text>
  <text x="821" y="432" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#f2f6ff">Accepted guidance</text>
  <text x="821" y="469" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#f2f6ff">informs the next search.</text>
  <text x="54" y="574" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#9fb0d0">Eduardo Cortes · Creative search &amp; memory</text>
  <text x="1146" y="574" text-anchor="end" font-family="DejaVu Sans Mono,monospace" font-size="16" fill="#9fb0d0">Idea_Search_Showcase</text>
</svg>
